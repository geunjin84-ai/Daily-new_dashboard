<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지식 대시보드 2.0</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --main: #333333;
      --sub: #555555;
      --accent: #007bff;
      --border: #f1f1f1;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --card: #1e1e1e;
      --main: #e0e0e0;
      --sub: #aaaaaa;
      --border: #2c2c2c;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--main); }
    .container { max-width: 800px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .card-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; border-bottom: 1px solid var(--border); padding-bottom: 8px; user-select: none; }
    .btn-refresh { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .box { background: rgba(0,123,255,0.04); padding: 10px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 10px; line-height: 1.5; }
    
    .learning-card { background: linear-gradient(135deg, #2b5876, #4e4376) !important; color: #ffffff !important; }
    .learning-card .card-header { border-bottom: 1px solid rgba(255,255,255,0.2); }
    .words-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
    @media(min-width: 480px) { .words-grid { grid-template-columns: 1fr; } }
    .word-item { background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; font-size: 0.82rem; line-height: 1.4; }
    
    .chip-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
    .chip { padding: 6px 12px; border-radius: 20px; font-size: 0.78rem; border: 1px solid #ddd; background: var(--card); cursor: pointer; color: var(--sub); font-weight: 600; }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    
    .news-group { margin-bottom: 20px; }
    .news-group-title { color: var(--accent); font-size: 0.95rem; font-weight: bold; margin: 15px 0 8px 0; border-left: 3px solid var(--accent); padding-left: 8px; }
    .news-item { border-bottom: 1px solid var(--border); padding: 12px 0; text-decoration: none; display: block; color: inherit; }
    .news-item:last-child { border-bottom: none; }
    .news-title-text { font-weight: 600; font-size: 0.88rem; line-height: 1.4; margin-bottom: 4px; }
    .news-item:hover .news-title-text { color: var(--accent); }
    .news-summary-text { font-size: 0.8rem; color: var(--sub); line-height: 1.4; }
    
    .speaker-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 3px 8px; border-radius: 10px; font-size: 0.75rem; cursor: pointer; margin-left: 6px; font-weight: bold; }
    .speaker-btn:hover { background: rgba(255,255,255,0.3); }
    .search-popup { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222222; color: #ffffff; padding: 10px 20px; border-radius: 30px; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 0.82rem; align-items: center; gap: 10px; }
    .search-popup button { border: none; background: var(--accent); color: #fff; border-radius: 15px; padding: 4px 12px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📰 지식 대시보드 2.0</h1>
      <button onclick="document.body.toggleAttribute('data-theme')" style="background:none; border:1px solid var(--border); padding:6px 12px; border-radius:20px; color:var(--main); cursor:pointer; font-size:0.8rem;">🌗 테마 전환</button>
    </div>

    <div class="card learning-card">
      <div class="card-header" onclick="toggleSection('learning-body')">
        <span><i class="fa-solid fa-brain"></i> ✨ 오늘의 명언 & 3초 입트기 영어 <span id="learning-body-btn">▲</span></span>
        <button class="btn-refresh" onclick="refreshDaily(event)" style="border-color:#fff; color:#fff;"><i class="fa-solid fa-arrows-rotate"></i> 다른 내용 보기</button>
      </div>
      <div id="learning-body" style="padding-top:10px;">
        <div style="font-size:0.8rem; font-weight:bold; color:#ffe066; margin-bottom:6px;">🎧 1단계: 3초 섀도잉 (원어민 발음 귀 열기)</div>
        <div style="font-style:italic; font-size:0.88rem; margin-bottom:12px; line-height:1.4; color:#fff;">
          <span id="quote-text"></span>
          <button class="speaker-btn" onclick="playTTS(event)"><i class="fa-solid fa-volume-high"></i> 발음 듣기</button>
          <br><span id="quote-ko" style="font-style:normal; font-size:0.8rem; opacity:0.85;"></span>
        </div>
        
        <div style="font-size:0.8rem; font-weight:bold; color:#ffe066; margin-top:12px;">🗣️ 2단계: 오늘의 만능 회화 패턴 [<span id="pattern-title"></span>]</div>
        <div class="words-grid" id="words-display"></div>
        
        <div style="font-size:0.8rem; font-weight:bold; color:#ffe066; margin-top:14px;">💬 3단계: 오늘의 3초 혼잣말 질문</div>
        <div style="background:rgba(255,255,255,0.1); padding:10px; border-radius:8px; font-size:0.82rem; margin-top:4px;">
          <b style="color:#ffe066;">Q: </b><span id="quiz-q-text"></span><br>
          <span id="quiz-hint-text" style="font-size:0.75rem; opacity:0.85;"></span>
        </div>
      </div>
    </div>

    <div class="card" style="border: 2px solid var(--accent);">
      <div class="card-header" onclick="toggleSection('finance-body')">
        <span><i class="fa-solid fa-graduation-cap"></i> ✏️ 3분 실전 경제 교실 <span id="finance-body-btn">▲</span></span>
        <button class="btn-refresh" onclick="refreshFinance(event)"><i class="fa-solid fa-arrows-rotate"></i> 다른 내용 보기</button>
      </div>
      <div id="finance-body" style="padding-top:10px;">
        <div class="box" id="stock-box"></div>
        <div class="box" id="economy-box"></div>
        <div class="box" id="quiz-box" style="background:rgba(40,167,69,0.05);"></div>
      </div>
    </div>

    <div class="chip-container" id="filter-chips"></div>

    <div class="card" style="border: 2px solid #28a745;">
      <div class="card-header" onclick="toggleSection('news-body')">
        <span><i class="fa-solid fa-newspaper"></i> 📰 신문 기사 보기 <span id="news-body-btn">▲</span></span>
        <button class="btn-refresh" onclick="refreshNews(event)" style="border-color:#28a745; color:#28a745;"><i class="fa-solid fa-arrows-rotate"></i> 기사 새로고침</button>
      </div>
      <div id="news-body" style="padding-top:10px;">
        <div id="news-container"></div>
      </div>
    </div>
  </div>

  <div class="search-popup" id="search-popup">
    <span>🔍 <b id="sel-word"></b> 사전 검색</span>
    <button onclick="goDict()">검색하기</button>
  </div>

  <script>
    let db = {};
    let enabledCats = [];
    let curFinanceIdx = 0;
    let curDailyIdx = 0;
    let selTxt = "";
    let currentQuoteEN = "";

    async function init() {
      try {
        const res = await fetch('./data.json?t=' + Date.now());
        db = await res.json();
        if (db.articles) {
          enabledCats = Object.keys(db.articles);
          refreshDaily();
          refreshFinance();
          renderChips();
          renderNews();
        }
      } catch (e) {
        console.error("데이터 로드 실패:", e);
      }
    }

    function toggleSection(id) {
      const el = document.getElementById
