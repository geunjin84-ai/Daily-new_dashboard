<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지식 대시보드 2.0</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --main: #333333;
      --sub: #555555;
      --accent: #007bff;
      --border: #f1f1f1;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --card: #1e1e1e;
      --main: #e0e0e0;
      --sub: #aaaaaa;
      --border: #2c2c2c;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--main); }
    .container { max-width: 800px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .card-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; border-bottom: 1px solid var(--border); padding-bottom: 8px; user-select: none; }
    .btn-refresh { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .box { background: rgba(0,123,255,0.04); padding: 10px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 10px; line-height: 1.5; }
    
    /* 영단어 명언 카드 전용 고급스러운 그라데이션 */
    .learning-card { background: linear-gradient(135deg, #2b5876, #4e4376) !important; color: #ffffff !important; }
    .learning-card .card-header { border-bottom: 1px solid rgba(255,255,255,0.2); }
    .words-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
    @media(min-width: 480px) { .words-grid { grid-template-columns: 1fr 1fr; } }
    .word-item { background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; font-size: 0.82rem; }
    
    .chip-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
    .chip { padding: 6px 12px; border-radius: 20px; font-size: 0.78rem; border: 1px solid #ddd; background: var(--card); cursor: pointer; color: var(--sub); font-weight: 600; }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    
    .news-group { margin-bottom: 20px; }
    .news-group-title { color: var(--accent); font-size: 0.95rem; font-weight: bold; margin: 15px 0 8px 0; border-left: 3px solid var(--accent); padding-left: 8px; }
    .news-item { border-bottom: 1px solid var(--border); padding: 12px 0; text-decoration: none; display: block; color: inherit; }
    .news-item:last-child { border-bottom: none; }
    .news-title-text { font-weight: 600; font-size: 0.88rem; line-height: 1.4; margin-bottom: 4px; }
    .news-item:hover .news-title-text { color: var(--accent); }
    .news-summary-text { font-size: 0.8rem; color: var(--sub); line-height: 1.4; }
    
    .search-popup { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222222; color: #ffffff; padding: 10px 20px; border-radius: 30px; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 0.82rem; align-items: center; gap: 10px; }
    .search-popup button { border: none; background: var(--accent); color: #fff; border-radius: 15px; padding: 4px 12px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📰 지식 대시보드 2.0</h1>
      <button onclick="document.body.toggleAttribute('data-theme')" style="background:none; border:1px solid var(--border); padding:6px 12px; border-radius:20px; color:var(--main); cursor:pointer; font-size:0.8rem;">🌗 테마 전환</button>
    </div>

    <div class="card learning-card">
      <div class="card-header" onclick="toggleSection('learning-body')">
        <span><i class="fa-solid fa-brain"></i> ✨ 오늘의 명언 & 핵심 영단어</span>
        <span id="learning-body-btn">▲ 접기</span>
      </div>
      <div id="learning-body" style="padding-top:10px;">
        <div id="quote-display" style="font-style:italic; font-size:0.88rem; margin-bottom:12px; line-height:1.4; color:#fff;"></div>
        <div style="font-size:0.8rem; font-weight:bold; color:#ffe066; margin-top:8px;">📚 실용 비즈니스 영단어</div>
        <div class="words-grid" id="words-display"></div>
      </div>
    </div>

    <div class="card" style="border: 2px solid var(--accent);">
      <div class="card-header">
        <span onclick="toggleSection('finance-body')"><i class="fa-solid fa-graduation-cap"></i> ✏️ 3분 실전 경제 교실 <span id="finance-body-btn">▲</span></span>
        <button class="btn-refresh" onclick="refreshFinance(event)"><i class="fa-solid fa-arrows-rotate"></i> 다른 내용 보기</button>
      </div>
      <div id="finance-body" style="padding-top:10px;">
        <div class="box" id="stock-box"></div>
        <div class="box" id="economy-box"></div>
        <div class="box" id="quiz-box" style="background:rgba(40,167,69,0.05);"></div>
      </div>
    </div>

    <div class="chip-container" id="filter-chips"></div>

    <div class="card" style="border: 2px solid #28a745;">
      <div class="card-header">
        <span onclick="toggleSection('news-body')"><i class="fa-solid fa-newspaper"></i> 📰 신문 기사 보기 <span id="news-body-btn">▲</span></span>
        <button class="btn-refresh" onclick="refreshNews(event)" style="border-color:#28a745; color:#28a745;"><i class="fa-solid fa-arrows-rotate"></i> 기사 새로고침</button>
      </div>
      <div id="news-body" style="padding-top:10px;">
        <div id="news-container"></div>
      </div>
    </div>
  </div>

  <div class="search-popup" id="search-popup">
    <span>🔍 <b id="sel-word"></b> 사전 검색</span>
    <button onclick="goDict()">검색하기</button>
  </div>

  <script>
    let db = {};
    let enabledCats = [];
    let curFinanceIdx = 0;
    let selTxt = "";

    async function init() {
      try {
        const res = await fetch('./data.json?t=' + Date.now());
        db = await res.json();
        if (db.articles) {
          enabledCats = Object.keys(db.articles);
          renderLearning();
          refreshFinance();
          renderChips();
          renderNews();
        }
      } catch (e) {
        console.error("데이터 로드 실패:", e);
      }
    }

    function toggleSection(id) {
      const el = document.getElementById(id);
      const btn = document.getElementById(id + '-btn');
      if (el.style.display === 'none') {
        el.style.display = 'block';
        btn.innerText = '▲ 접기';
      } else {
        el.style.display = 'none';
        btn.innerText = '▼ 펴기';
      }
    }

    function renderLearning() {
      if (!db.learning || !db.learning.daily) return;
      const d = db.learning.daily;
      
      // 명언 연동
      document.getElementById('quote-display').innerHTML = `"${d.quote.en}"<br><span style="font-style:normal; font-size:0.8rem; opacity:0.85;">(${d.quote.ko}) - ${d.quote.author}</span>`;
      
      // 영단어 연동
      document.getElementById('words-display').innerHTML = d.words.map(w => `
        <div class="word-item">
          <strong style="color:#ffe066;">${w.word}</strong> : ${w.meaning}<br>
          <span style="font-size:0.75rem; opacity:0.8;">예) ${w.example}</span>
        </div>
      `).join('');
    }

    function refreshFinance(e) {
      if (e) e.stopPropagation();
      if (!db.learning || !db.learning.finance_sets) return;
      
      const sets = db.learning.finance_sets;
      const f = sets[curFinanceIdx];
      
      document.getElementById('stock-box').innerHTML = `<b>📈 오늘의 실전 주식 용어</b><br><b>• 용어:</b> ${f.stock.term}<br><b>• 3초 개념:</b> ${f.stock.concept}<br><b>• 쉽게 말해:</b> ${f.stock.analogy}<br><b>• 신호등 판단:</b> ${f.stock.signal}<br><b>📍 MTS 위치:</b> <span style="color:var(--accent); font-weight:bold;">${f.stock.mts}</span>`;
      document.getElementById('economy-box').innerHTML = `<b>💡 오늘의 생활 경제 상식</b><br><b>• 주제:</b> ${f.economy.title}<br><b>• 핵심:</b> ${f.economy.concept}<br><b>• 삶의 영향:</b> ${f.economy.impact}`;
      
      document.getElementById('quiz-box').innerHTML = `<b>🎯 3초 실전 퀴즈</b><br><div style="margin:5px 0;">Q. ${f.quiz.q}</div>` + f.quiz.opts.map((o, i) => `
        <button onclick="alert('${i === f.quiz.ans ? '🎉 정답입니다!\n\n💡 해설: ' + f.quiz.exp : '❌ 오답입니다. 다시 한번 읽어보세요!'}')" style="width:100%; text-align:left; margin-top:6px; padding:8px; border:1px solid #28a745; background:var(--card); color:var(--main); border-radius:6px; cursor:pointer; font-size:0.8rem;">${i + 1}. ${o}</button>
      `).join('');
      
      curFinanceIdx = (curFinanceIdx + 1) % sets.length;
    }

    function refreshNews(e) {
      if (e) e.stopPropagation();
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('news-container');
      container.innerHTML = '';
      
      if (!db.articles) return;
      
      enabledCats.forEach(cat => {
        const articles = db.articles[cat];
        if (!articles || articles.length === 0) return;
        
        // 🔄 새로고침 시 무작위로 섞어서 상위 3개 추출 (중복 노출 방지)
        const shuffled = [...articles].sort(() => Math.random() - 0.5).slice(0, 3);
        
        const groupDiv = document.createElement('div');
        groupDiv.className = 'news-group';
        
        let groupHtml = `<div class="news-group-title">${cat}</div>`;
        
        shuffled.forEach(a => {
          // 해외 소식인 경우 구글 번역 링크 래핑, 국내 소식은 원문 직접 링크
          const finalLink = cat.includes('해외') || cat.includes('글로벌') 
            ? `https://translate.google.com/translate?u=${encodeURIComponent(a.link)}` 
            : a.link;
            
          groupHtml += `
            <a class="news-item" href="${finalLink}" target="_blank" rel="noopener noreferrer">
              <div class="news-title-text">${a.title}</div>
              <div class="news-summary-text">${a.summary}</div>
            </a>
          `;
        });
        
        groupDiv.innerHTML = groupHtml;
        container.appendChild(groupDiv);
      });
    }

    function renderChips() {
      const container = document.getElementById('filter-chips');
      container.innerHTML = '';
      if (!db.articles) return;
      
      Object.keys(db.articles).forEach(cat => {
        const chip = document.createElement('div');
        chip.className = 'chip active';
        chip.innerText = cat;
        chip.onclick = () => {
          chip.classList.toggle('active');
          enabledCats = Array.from(document.querySelectorAll('.chip.active')).map(c => c.innerText);
          renderNews();
        };
        container.appendChild(chip);
      });
    }

    // 드래그 선택 단어 감지
    document.addEventListener('selectionchange', () => {
      const selection = window.getSelection();
      const text = selection.toString().trim();
      const popup = document.getElementById('search-popup');
      
      if (text && text.length > 0 && text.length < 15) {
        selTxt = text;
        document.getElementById('sel-word').innerText = text;
        popup.style.display = 'flex';
      } else if (!text) {
        popup.style.display = 'none';
      }
    });

    function goDict() {
      if (selTxt) {
        window.open(`https://search.naver.com/search.naver?query=${encodeURIComponent(selTxt + ' 뜻')}`, '_blank');
      }
    }

    init();
  </script>
</body>
</html>
