<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지식 대시보드 2.0</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --main: #333333;
      --sub: #555555;
      --accent: #007bff;
      --border: #f1f1f1;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --card: #1e1e1e;
      --main: #e0e0e0;
      --sub: #aaaaaa;
      --border: #2c2c2c;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--main); }
    .container { max-width: 800px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .card-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; border-bottom: 1px solid var(--border); padding-bottom: 8px; user-select: none; }
    .btn-refresh { background: none; border: 1px solid var(--accent); color: var(--accent); padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .box { background: rgba(0,123,255,0.04); padding: 10px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 10px; line-height: 1.5; }
    
    .learning-card { background: linear-gradient(135deg, #2b5876, #4e4376) !important; color: #ffffff !important; }
    .learning-card .card-header { border-bottom: 1px solid rgba(255,255,255,0.2); }
    .words-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
    .word-item { background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; font-size: 0.82rem; line-height: 1.4; }
    
    .filter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.85rem; font-weight: bold; color: var(--sub); }
    .ctrl-link-group { display: flex; gap: 10px; font-size: 0.8rem; font-weight: bold; }
    .ctrl-link { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .ctrl-link:hover { opacity: 0.8; }
    
    .chip-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
    .chip { padding: 6px 12px; border-radius: 20px; font-size: 0.78rem; border: 1px solid #ddd; background: var(--card); cursor: pointer; color: var(--sub); font-weight: 600; }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    
    .news-group { margin-bottom: 20px; }
    .news-group-title { color: var(--accent); font-size: 0.95rem; font-weight: bold; margin: 15px 0 8px 0; border-left: 3px solid var(--accent); padding-left: 8px; }
    .news-item { border-bottom: 1px solid var(--border); padding: 12px 0; text-decoration: none; display: block; color: inherit; }
    .news-item:last-child { border-bottom: none; }
    .news-title-text { font-weight: 600; font-size: 0.88rem; line-height: 1.4; margin-bottom: 4px; }
    .news-item:hover .news-title-text { color: var(--accent); }
    .news-summary-text { font-size: 0.8rem; color: var(--sub); line-height: 1.4; }
    
    .speaker-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 3px 8px; border-radius: 10px; font-size: 0.75rem; cursor: pointer; margin-left: 6px; font-weight: bold; }
    .speaker-btn:hover { background: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📰 지식 대시보드 2.0</h1>
      <button onclick="document.body.toggleAttribute('data-theme')" style="background:none; border:1px solid var(--border); padding:6px 12px; border-radius:20px; color:var(--main); cursor:pointer; font-size:0.8rem;">🌗 테마 전환</button>
    </div>

    <div class="card learning-card">
      <div class="card-header" onclick="toggleSection('learning-body')">
        <span><i class="fa-solid fa-brain"></i> ✨ 오늘의 명언 & 3초 입트기 영어 <span id="learning-body-btn">▲</span></span>
        <button class="btn-refresh" onclick="refreshDaily(event)" style="border-color:#fff; color:#fff;"><i class="fa-solid fa-arrows-rotate"></i> 다른 내용 보기</button>
      </div>
      <div id="learning-body" style="padding-top:10px;">
        <div style="font-size:0.8rem; font-weight:bold; color:#ffe066; margin-bottom:6px;">🎧 1단계: 3초 섀도잉 (원어민 발음 귀 열기)</div>
        <div style="font-style:italic; font-size:0.88rem; margin-bottom:12px; line-height:1.4; color:#fff;">
          <span id="quote-text">데이터 로딩 중...</span>
          <button class="speaker-btn" onclick="playTTS(event)"><i class="fa-solid fa-volume-high"></i> 발음 듣기</button>
          <br><span id="quote-ko" style="font-style:normal; font-size:0.8rem; opacity:0.85;"></span>
        </div>
        
        <div style="font-size:0.8rem; font-weight:bold; color:#ffe066; margin-top:12px;">🗣️ 2단계: 오늘의 만능 회화 패턴 [<span id="pattern-title">-</span>]</div>
        <div class="words-grid" id="words-display"></div>
        
        <div style="font-size:0.8rem; font-weight:bold; color:#ffe066; margin-top:14px;">💬 3단계: 오늘의 3초 혼잣말 질문</div>
        <div style="background:rgba(255,255,255,0.1); padding:10px; border-radius:8px; font-size:0.82rem; margin-top:4px;">
          <b style="color:#ffe066;">Q: </b><span id="quiz-q-text">-</span><br>
          <span id="quiz-hint-text" style="font-size:0.75rem; opacity:0.85;"></span>
        </div>
      </div>
    </div>

    <div class="card" style="border: 2px solid var(--accent);">
      <div class="card-header" onclick="toggleSection('finance-body')">
        <span><i class="fa-solid fa-graduation-cap"></i> ✏️ 3분 실전 경제 교실 <span id="finance-body-btn">▲</span></span>
        <button class="btn-refresh" onclick="refreshFinance(event)"><i class="fa-solid fa-arrows-rotate"></i> 다른 내용 보기</button>
      </div>
      <div id="finance-body" style="padding-top:10px;">
        <div class="box" id="stock-box">로딩 중...</div>
        <div class="box" id="economy-box">로딩 중...</div>
        <div class="box" id="quiz-box" style="background:rgba(40,167,69,0.05);">로딩 중...</div>
      </div>
    </div>

    <div class="filter-header">
      <span>📌 표시할 카테고리 선택</span>
      <div class="ctrl-link-group">
        <span class="ctrl-link" onclick="selectAllCats()">전체 선택</span>
        <span style="opacity:0.3;">|</span>
        <span class="ctrl-link" onclick="deselectAllCats()" style="color:var(--sub);">전체 해제</span>
      </div>
    </div>
    <div class="chip-container" id="filter-chips"></div>

    <div class="card" style="border: 2px solid #28a745;">
      <div class="card-header" onclick="toggleSection('news-body')">
        <span><i class="fa-solid fa-newspaper"></i> 📰 신문 기사 보기 <span id="news-body-btn">▲</span></span>
        <button class="btn-refresh" onclick="refreshNews(event)" style="border-color:#28a745; color:#28a745;"><i class="fa-solid fa-arrows-rotate"></i> 기사 새로고침</button>
      </div>
      <div id="news-body" style="padding-top:10px;">
        <div id="news-container">기사를 불러오는 중입니다...</div>
      </div>
    </div>
  </div>

  <script>
    let db = {};
    let enabledCats = [];
    let curFinanceIdx = 0;
    let curDailyIdx = 0;
    let currentQuoteEN = "";

    async function init() {
      try {
        const res = await fetch('./data.json?t=' + Date.now());
        db = await res.json();
        
        if (db) {
          if (db.articles) {
            // data.json 내부의 동적 카테고리를 그대로 바인딩
            enabledCats = Object.keys(db.articles);
            renderChips();
            renderNews();
          }
          refreshDaily();
          refreshFinance();
        }
      } catch (e) {
        console.error("데이터 로드 실패:", e);
      }
    }

    function toggleSection(id) {
      const el = document.getElementById(id);
      const btn = document.getElementById(id + '-btn');
      if (el.style.display === 'none') {
        el.style.display = 'block';
        btn.innerText = '▲';
      } else {
        el.style.display = 'none';
        btn.innerText = '▼';
      }
    }

    function refreshDaily(e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      
      if (!db.learning || !db.learning.daily_sets || db.learning.daily_sets.length === 0) return;
      
      const sets = db.learning.daily_sets;
      const d = sets[curDailyIdx % sets.length];
      
      if (d) {
        if (d.quote) {
          currentQuoteEN = d.quote.en || "";
          document.getElementById('quote-text').innerText = `"${d.quote.en || ''}"`;
          document.getElementById('quote-ko').innerText = `(${d.quote.ko || ''}) - ${d.quote.author || ''}`;
        }
        
        document.getElementById('pattern-title').innerText = d.pattern || '';
        
        if (d.words && Array.isArray(d.words)) {
          document.getElementById('words-display').innerHTML = d.words.map(w => `
            <div class="word-item">
              • <b style="color:#ffe066; font-size:0.85rem;">${w.word}</b> ➔ <b>${w.example}</b> (${w.meaning})
            </div>
          `).join('');
        }
        
        if (d.question) {
          document.getElementById('quiz-q-text').innerText = d.question.q || '';
          document.getElementById('quiz-hint-text').innerText = `💡 힌트: ${d.question.hint || ''}`;
        }
        
        curDailyIdx = (curDailyIdx + 1) % sets.length;
      }
    }

    function playTTS(e) {
      if (e) e.stopPropagation();
      if (!currentQuoteEN) return;
      
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(currentQuoteEN);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("이 브라우저는 음성 재생을 지원하지 않습니다.");
      }
    }

    function formatTerm(term) {
      if (!term) return "";
      const enRegex = /([A-Z]{2,})/g;
      const match = term.match(enRegex);
      if (match) {
        const token = match[0];
        const fullNames = {
          "PER": "Price Earnings Ratio", "PBR": "Price Book-value Ratio",
          "ROE": "Return On Equity", "ROA": "Return On Assets",
          "EPS": "Earnings Per Share", "FOMC": "Federal Open Market Committee",
          "CPI": "Consumer Price Index", "GDP": "Gross Domestic Product"
        };
        if (fullNames[token]) {
          return term.replace(token, `${token} <span style="font-size:0.75rem; font-weight:normal; opacity:0.75;">(${fullNames[token]})</span>`);
        }
      }
      return term;
    }

    function refreshFinance(e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      
      if (!db.learning || !db.learning.finance_sets || db.learning.finance_sets.length === 0) return;
      
      const sets = db.learning.finance_sets;
      const f = sets[curFinanceIdx % sets.length];
      
      if (f) {
        const formattedTerm = formatTerm(f.stock.term);
        
        document.getElementById('stock-box').innerHTML = `<b>📈 오늘의 실전 주식 용어</b><br><b>• 용어:</b> ${formattedTerm}<br><b>• 3초 개념:</b> ${f.stock.concept}<br><b>• 쉽게 말해:</b> ${f.stock.analogy}<br><b>• 신호등 판단:</b> ${f.stock.signal}<br><b>📍 MTS 위치:</b> <span style="color:var(--accent); font-weight:bold;">${f.stock.mts}</span>`;
        document.getElementById('economy-box').innerHTML = `<b>💡 오늘의 생활 경제 상식</b><br><b>• 주제:</b> ${f.economy.title}<br><b>• 핵심:</b> ${f.economy.concept}<br><b>• 삶의 영향:</b> ${f.economy.impact}`;
        
        let quizHtml = `<b>🎯 3초 실전 퀴즈</b><br><div style="margin:5px 0;">Q. ${f.quiz.q}</div>`;
        if (f.quiz.opts && Array.isArray(f.quiz.opts)) {
          quizHtml += f.quiz.opts.map((o, i) => `
            <button onclick="alert('${i === f.quiz.ans ? '🎉 정답입니다!\n\n💡 해설: ' + f.quiz.exp : '❌ 오답입니다. 다시 한번 읽어보세요!'}')" style="width:100%; text-align:left; margin-top:6px; padding:8px; border:1px solid #28a745; background:var(--card); color:var(--main); border-radius:6px; cursor:pointer; font-size:0.8rem;">${i + 1}. ${o}</button>
          `).join('');
        }
        document.getElementById('quiz-box').innerHTML = quizHtml;
        
        curFinanceIdx = (curFinanceIdx + 1) % sets.length;
      }
    }

    function refreshNews(e) {
      if (e) e.stopPropagation();
      renderNews();
    }

    function renderNews() {
      const container = document.getElementById('news-container');
      container.innerHTML = '';
      if (!db.articles) return;
      
      enabledCats.forEach(cat => {
        const articles = db.articles[cat];
        if (!articles || articles.length === 0) return;
        
        const shuffled = [...articles].sort(() => Math.random() - 0.5).slice(0, 3);
        const groupDiv = document.createElement('div');
        groupDiv.className = 'news-group';
        
        let groupHtml = `<div class="news-group-title">${cat}</div>`;
        shuffled.forEach(a => {
          groupHtml += `
            <a class="news-item" href="${a.link}" target="_blank" rel="noopener noreferrer">
              <div class="news-title-text">${a.title}</div>
              <div class="news-summary-text">${a.summary}</div>
            </a>
          `;
        });
        
        groupDiv.innerHTML = groupHtml;
        container.appendChild(groupDiv);
      });
    }

    function selectAllCats() {
      if (!db.articles) return;
      enabledCats = Object.keys(db.articles);
      document.querySelectorAll('.chip.cat-chip').forEach(c => c.classList.add('active'));
      renderNews();
    }

    function deselectAllCats() {
      enabledCats = [];
      document.querySelectorAll('.chip.cat-chip').forEach(c => c.classList.remove('active'));
      renderNews();
    }

    function renderChips() {
      const container = document.getElementById('filter-chips');
      container.innerHTML = '';
      if (!db.articles) return;

      Object.keys(db.articles).forEach(cat => {
        const chip = document.createElement('div');
        chip.className = 'chip cat-chip active';
        chip.innerText = cat;
        chip.onclick = () => {
          chip.classList.toggle('active');
          enabledCats = Array.from(document.querySelectorAll('.chip.cat-chip.active')).map(c => c.innerText);
          renderNews();
        };
        container.appendChild(chip);
      });
    }

    init();
  </script>
</body>
</html>
